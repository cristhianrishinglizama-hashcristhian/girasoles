<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f1ea;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        #btn-inicio {
            background: none;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s;
            position: absolute;
            z-index: 10;
        }

        #btn-inicio:hover {
            transform: scale(1.1);
        }

        .girasol-btn {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #5a3e1b 30%, #ffcc00 31%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            margin: 0 auto;
        }

        .texto-click {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        #canvas-animacion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #mensaje {
            position: absolute;
            left: 8%;
            top: 20%;
            width: 45%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            color: #2c2c2c;
            line-height: 1.6;
        }

        #mensaje h2 {
            font-size: 22px;
            color: #d4a017;
            margin-bottom: 15px;
        }

        #mensaje p {
            font-size: 15px;
            margin-bottom: 10px;
        }

        /* Estilo para el segundo botón que aparece al final */
        #btn-extra {
            position: absolute;
            bottom: 10%;
            left: 15%;
            background-color: #ffcc00;
            color: #3e2723;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease, transform 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 20;
            font-family: 'Georgia', serif;
        }

        #btn-extra:hover {
            transform: scale(1.08);
            background-color: #ffdb4d;
        }

        @media (max-width: 768px) {
            #mensaje {
                width: 84%;
                left: 8%;
                top: 8%;
            }
            #mensaje h2 { font-size: 17px; }
            #mensaje p { font-size: 12px; }
            #btn-extra { left: 10%; bottom: 8%; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Primer botón inicial -->
    <button id="btn-inicio" onclick="comenzarMagia()">
        <div class="girasol-btn"></div>
        <div class="texto-click">Click Aqui</div>
    </button>

    <canvas id="canvas-animacion"></canvas>

    <div id="mensaje">
        <h2>FELIZ DIA DE LAS FLORES AMARILLAS</h2>
        <p><strong>CADA GIRASOL QUE VES AQUI ES UN LATIDO DE MI CORAZON.</strong></p>
        <p>ASI COMO EL SOL ILUMINA LOS CAMPOS, TU ILUMINAS MI VIDA.</p>
        <p>QUE ESTAS FLORES TE RECUERDEN LO ESPECIAL QUE ERES PARA MI.<br><strong>¡TE AMO!</strong></p>
    </div>

    <!-- Segundo botón extra que aparece al terminar -->
    <button id="btn-extra" onclick="lanzarMasFlores()">¡Haz clic para mas flores! 🌻</button>

    <script>
        const canvas = document.getElementById('canvas-animacion');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let xCentro = window.innerWidth < 768 ? canvas.width * 0.5 : canvas.width * 0.65;
        let alturaTalloFinal = canvas.height * 0.38;
        let sueloY = canvas.height - 100;

        function comenzarMagia() {
            document.getElementById('btn-inicio').style.display = 'none';
            let yActualTallo = sueloY;

            let animarTallo = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Suelo
                ctx.strokeStyle = "#444";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.05, sueloY);
                ctx.lineTo(canvas.width * 0.95, sueloY);
                ctx.stroke();

                // Tallo
                ctx.strokeStyle = "#2e7d32";
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.moveTo(xCentro, sueloY);
                ctx.lineTo(xCentro, yActualTallo);
                ctx.stroke();

                yActualTallo -= 10;

                if (yActualTallo <= alturaTalloFinal) {
                    clearInterval(animarTallo);
                    dibujarCorazonProgresivo(xCentro, alturaTalloFinal);
                }
            }, 25);
        }

        function dibujarCorazonProgresivo(cx, cy) {
            let i = 0;
            let maxFlores = 260; // ¡Muchísimas más flores para que quede lleno!

            let animarFlores = setInterval(() => {
                if (i >= maxFlores) {
                    clearInterval(animarFlores);
                    // Mostrar mensaje y el segundo botón
                    document.getElementById('mensaje').style.opacity = 1;
                    let btnEx = document.getElementById('btn-extra');
                    btnEx.style.opacity = 1;
                    btnEx.style.pointerEvents = 'auto';
                    return;
                }

                let t = (i / maxFlores) * Math.PI * 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                let escala = window.innerWidth < 768 ? 9 : 12;
                let posX = cx + x * escala;
                let posY = (cy - 30) + y * escala;

                pintarGirasolIndividual(posX, posY, 10);
                i++;
            }, 20);
        }

        // Función del segundo botón para llenar de más flores alrededor
        function lanzarMasFlores() {
            document.getElementById('btn-extra').style.display = 'none';
            for (let j = 0; j < 80; j++) {
                let rx = xCentro + (Math.random() - 0.5) * 350;
                let ry = (alturaTalloFinal - 20) + (Math.random() - 0.5) * 250;
                pintarGirasolIndividual(rx, ry, 9);
            }
        }

        function pintarGirasolIndividual(x, y, radio) {
            ctx.fillStyle = "#ffcc00";
            for (let p = 0; p < 8; p++) {
                let angulo = (p * Math.PI) / 4;
                ctx.beginPath();
                ctx.arc(x + Math.cos(angulo) * (radio * 0.55), y + Math.sin(angulo) * (radio * 0.55), radio * 0.45, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = "#3e2723";
            ctx.beginPath();
            ctx.arc(x, y, radio * 0.42, 0, Math.PI * 2);
            ctx.fill();
        }
    </script>
</body>
</html>
